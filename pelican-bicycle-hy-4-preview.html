<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 15%, #1e293b, #0b1220 70%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { width: min(96vw, 980px); padding: 18px 0 34px; }
  .stage h1 {
    margin: 0 0 12px; text-align: center;
    font-size: 14px; font-weight: 600; letter-spacing: .18em;
    color: #94a3b8; text-transform: uppercase;
  }
  svg { width: 100%; height: auto; display: block; border-radius: 20px;
        box-shadow: 0 28px 70px rgba(0,0,0,.55); }

  /* ---------- 视差滚动（仅位移，不依赖 transform-origin） ---------- */
  .hills   { animation: scrollX 46s linear infinite; }
  .bushes  { animation: scrollX 14s linear infinite; }
  .dashes  { animation: dash  .41s linear infinite; }
  .fg      { animation: fg    .40s linear infinite; }
  .whoosh  { animation: whoosh .55s linear infinite; }
  .whoosh:nth-of-type(2) { animation-delay: -.18s; }
  .whoosh:nth-of-type(3) { animation-delay: -.36s; }
  .cloud-a { animation: drift 34s linear infinite; }
  .cloud-b { animation: drift 52s linear infinite; }
  .cloud-c { animation: drift 26s linear infinite; }
  .dust    { transform-box: fill-box; transform-origin: 50% 50%;
              animation: dust 1.1s ease-out infinite; }
  .dust.d2 { animation-delay: -.37s; }
  .dust.d3 { animation-delay: -.74s; }
  .rig     { animation: bump .8s ease-in-out infinite; }

  @keyframes scrollX { from { transform: translateX(0); }      to { transform: translateX(-900px); } }
  @keyframes dash    { from { transform: translateX(0); }      to { transform: translateX(-180px); } }
  @keyframes fg      { from { transform: translateX(0); }      to { transform: translateX(-240px); } }
  @keyframes drift   { from { transform: translateX(960px); }  to { transform: translateX(-260px); } }
  @keyframes whoosh  { 0% { transform: translateX(28px); opacity: 0; }
                       35% { opacity: .6; }
                       100% { transform: translateX(-64px); opacity: 0; } }
  @keyframes dust    { 0% { transform: translate(0,0) scale(.5); opacity: .45; }
                       100% { transform: translate(-72px,-22px) scale(1.5); opacity: 0; } }
  @keyframes bump    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  @media (prefers-reduced-motion: reduce) {
    .hills,.bushes,.dashes,.fg,.whoosh,.cloud-a,.cloud-b,.cloud-c,.dust,.rig { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <h1>Pelican on a Bicycle</h1>
<svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的动画">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="55%"  stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#57534e"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="basketG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e3b778"/>
      <stop offset="100%" stop-color="#b98544"/>
    </linearGradient>

    <!-- 车轮美术（局部坐标，圆心 0,0） -->
    <g id="wheelArt">
      <circle r="56" fill="none" stroke="#111827" stroke-width="9"/>
      <circle r="50" fill="none" stroke="#e5e7eb" stroke-width="4"/>
      <path d="M0,-48V48 M-48,0H48 M-41.6,-24L41.6,24 M-41.6,24L41.6,-24 M-24,-41.6L24,41.6 M-24,41.6L24,-41.6"
            stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="-3.5" y="-53" width="7" height="11" rx="2.5" fill="#ef4444"/>
      <circle r="7" fill="#9ca3af"/>
      <circle r="3" fill="#4b5563"/>
    </g>

    <g id="cloud">
      <path d="M0,0 C-14,0 -22,-9 -18,-18 C-16,-31 4,-38 20,-31 C28,-44 52,-44 60,-31 C78,-35 92,-24 88,-12 C96,-6 92,4 80,4 Z"
            fill="#ffffff" opacity=".85"/>
    </g>

    <g id="bush">
      <path d="M0,0 C-6,-14 -2,-26 10,-30 C16,-42 36,-42 42,-30 C56,-30 62,-16 54,-6 C58,-2 56,2 50,2 Z"/>
    </g>
  </defs>

  <!-- ================= 天空 / 远景 ================= -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(772,86)">
    <g>

                        dur="40s" repeatCount="indefinite"/>

        <path d="M-38,-38L-49,-49"/><path d="M38,38L49,49"/><path d="M-38,38L-49,49"/><path d="M38,-38L49,-49"/>
      </g>
    </g>
    <circle r="34" fill="#fde047"/>
    <circle r="26" fill="#fef08a"/>
  </g>

  <!-- 云 -->
  <g class="cloud-a"><g transform="translate(0,96) scale(.85)"><use href="#cloud"/></g></g>
  <g class="cloud-b"><g transform="translate(0,58) scale(1.15)"><use href="#cloud"/></g></g>
  <g class="cloud-c"><g transform="translate(0,140) scale(.6)"><use href="#cloud"/></g></g>

  <!-- 远山（两段 900 无缝循环） -->

    <g fill="#86c9a4">
      <path d="M0,414 L0,330 C60,268 150,268 205,318 C255,362 300,300 360,336 C420,300 470,356 520,322 C580,282 650,336 700,352 C760,332 820,352 900,326 L900,414 Z"/>
      <path d="M900,414 L900,326 C960,352 1020,332 1080,352 C1140,336 1210,282 1270,322 C1320,356 1370,300 1430,336 C1490,300 1535,362 1585,318 C1640,268 1730,268 1800,330 L1800,414 Z"/>
    </g>

  <!-- 草地 -->

  <rect x="0" y="404" width="900" height="6" fill="#84cc16"/>
  <g class="bushes">
    <use href="#bush" transform="translate(60,412)"        fill="#4d7c0f"/>
    <use href="#bush" transform="translate(330,416) scale(.8)" fill="#3f6212"/>
    <use href="#bush" transform="translate(640,412)"       fill="#4d7c0f"/>
    <use href="#bush" transform="translate(960,416) scale(.9)" fill="#3f6212"/>

  <rect x="0" y="430" width="900" height="90" fill="url(#road)"/>
  <rect x="0" y="428" width="900" height="4" fill="#78716c"/>
  <g class="dashes" fill="#fde68a" opacity=".9">

    <rect x="360"  y="470" width="96" height="9" rx="4"/>
    <rect x="540"  y="470" width="96" height="9" rx="4"/>
    <rect x="720"  y="470" width="96" height="9" rx="4"/>
    <rect x="900"  y="470" width="96" height="9" rx="4"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">

    <path class="whoosh" d="M52,246 H168"/>
    <path class="whoosh" d="M92,304 H182"/>

  <g transform="translate(400,436)">

                        dur="0.8s" repeatCount="indefinite"/>
      <ellipse rx="178" ry="11" fill="#1f2937" opacity=".25"/>

  </g>

  <g class="rig">

    <!-- 远侧曲柄 + 远侧腿（在车架之后） -->

              calcMode="linear"
              keyTimes="0;0.083333;0.166667;0.250000;0.333333;0.416667;0.500000;0.583333;0.666667;0.750000;0.833333;0.916667;1"
              values="89.07 0 0;103.58 0 0;110.29 0 0;106.84 0 0;94.53 0 0;76.77 0 0;56.53 0 0;36.64 0 0;23.89 0 0;30.98 0 0;49.71 0 0;70.20 0 0;89.07 0 0"/>
            <path d="M0,0 Q30,2 68,0" fill="none" stroke="#c2710c" stroke-width="8" stroke-linecap="round"/>
            <g transform="translate(68,0)">
              <g>
                <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"

                  values="-120.94 0 0;-123.05 0 0;-116.76 0 0;-105.33 0 0;-94.22 0 0;-85.59 0 0;-79.27 0 0;-75.07 0 0;-75.14 0 0;-84.59 0 0;-98.74 0 0;-111.87 0 0;-120.94 0 0"/>
                <path id="farFoot" d="M-18,-3 C-2,-6 16,-4 18,2 C12,7 -10,7 -18,4 Z" fill="#c2710c"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- 前叉 / 车轮 -->
    <g transform="translate(270,370)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0"
                          dur="0.8s" repeatCount="indefinite"/>

      </g>
    </g>
    <g transform="translate(530,370)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0"
                          dur="0.8s" repeatCount="indefinite"/>
        <use href="#wheelArt"/>
      </g>
    </g>

    <!-- 链条 + 齿盘 -->
    <path d="M390,356 L270,362 M390,388 L270,378" stroke="#52525b" stroke-width="3.5" fill="none"/>
    <g transform="translate(270,370)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0"
                          dur="0.8s" repeatCount="indefinite"/>
        <circle r="9.5" fill="none" stroke="#9ca3af" stroke-width="5" stroke-dasharray="2.5 2.5"/>
      </g>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke-linecap="round">
      <path d="M390,372 L336,268" stroke="#ef4444" stroke-width="10"/>
      <path d="M390,372 L508,292" stroke="#ef4444" stroke-width="10"/>
      <path d="M344,276 L502,258" stroke="#ef4444" stroke-width="10"/>
      <path d="M502,252 L514,296" stroke="#ef4444" stroke-width="12"/>
      <path d="M512,290 Q524,332 530,370" stroke="#1f2937" stroke-width="8"/>
      <path d="M390,372 L270,370" stroke="#ef4444" stroke-width="9"/>
      <path d="M270,370 L342,282" stroke="#ef4444" stroke-width="9"/>
      <path d="M390,372 L336,268" stroke="#fca5a5" stroke-width="3" opacity=".7"/>
      <path d="M344,276 L502,258" stroke="#fca5a5" stroke-width="3" opacity=".7"/>
      <path d="M390,372 L508,292" stroke="#fca5a5" stroke-width="3" opacity=".7"/>
    </g>

    <!-- 车把 + 车铃 + 车筐 -->

          fill="none" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <circle cx="548" cy="249" r="7" fill="#dc2626"/>
    <circle cx="508" cy="229" r="6.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <path d="M544,250 L556,262" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>

    <path d="M582,262 L574,238 L590,250 L602,234 L598,262 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.6"/>
    <path d="M614,260 L608,244 L620,252 L628,242 L626,260 Z" fill="#38bdf8" stroke="#1d4ed8" stroke-width="1.4"/>
    <path d="M552,256 H622 L613,304 H562 Z" fill="url(#basketG)" stroke="#8a5a22" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#8a5a22" stroke-width="1.8" opacity=".65">
      <path d="M557,272 H620"/><path d="M559,288 H617"/>
      <path d="M574,258 L578,302"/><path d="M594,258 L596,302"/>
    </g>

    <!-- 车座 -->
    <path d="M310,262 C322,253 350,253 361,262 C352,271 318,271 310,262 Z" fill="#1f2937"/>

    <!-- ================= 鹈鹕 ================= -->
    <!-- 尾羽 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 250 224;3.5 250 224;0 250 224;-3 250 224;0 250 224"
                        dur="1s" repeatCount="indefinite"/>
      <path d="M252,212 C224,206 202,194 188,180 C200,192 206,202 210,212 C216,230 236,244 254,246 Z"
            fill="#cbd5e1" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 远侧翅膀（在身体之后） -->

    <!-- 身体（带踩踏节奏的轻微起伏） -->

      <animateTransform attributeName="transform" type="rotate"
                        values="0 338 300;-1.7 338 300;0 338 300;1.7 338 300;0 338 300"
                        dur="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" additive="sum"
                        values="0 0;0 -2.4;0 0;0 1.6;0 0" dur="1s" repeatCount="indefinite"/>

      <path d="M246,222 C240,190 276,170 322,174 C362,178 392,192 394,218

            fill="url(#bodyG)" stroke="#94a3b8" stroke-width="3"/>
      <path d="M266,254 C286,290 328,300 356,286 C334,300 288,300 264,272 Z" fill="#dbe3ec" opacity=".85"/>

      <!-- 脖子 -->

      <path d="M374,214 C380,178 402,152 434,146" fill="none" stroke="#e2e8f0" stroke-width="36"

      <!-- 头（含点头） -->

        <animateTransform attributeName="transform" type="rotate"
                          values="0 392 210;2.2 392 210;0 392 210;-2 392 210;0 392 210"
                          dur="1s" repeatCount="indefinite" additive="sum"/>
        <path d="M418,126 C412,110 417,101 426,99 C424,110 429,118 435,125 Z" fill="#cbd5e1"/>
        <path d="M430,120 C426,106 431,98 439,97 C437,107 441,114 446,120 Z" fill="#cbd5e1"/>
        <circle cx="440" cy="144" r="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
        <circle cx="452" cy="138" r="7.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="453" cy="138.5" r="3.8" fill="#1f2937"/>
        <circle cx="451.6" cy="137" r="1.3" fill="#ffffff"/>

        <!-- 上喙 -->

              fill="#fbbf24" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

          <animateTransform attributeName="transform" type="rotate"
                            values="0 452 158;2.4 452 158;0 452 158;-2 452 158;0 452 158"
                            dur="0.5s" repeatCount="indefinite"/>
          <path d="M452,158 C462,196 500,218 542,206 C558,200 566,190 570,180

      <!-- 围巾 -->

                            values="0 336 190;9 336 190;0 336 190;-9 336 190;0 336 190"
                            dur="0.5s" repeatCount="indefinite" begin="-0.12s"/>
          <path d="M334,190 C304,186 278,196 258,212 C280,217 306,210 324,202 C330,199 334,194 334,190 Z" fill="#dc2626"/>

      </g>

      <!-- 近侧翅膀（搭在车把上） -->
      <path d="M350,208 C392,202 462,220 540,244 C552,248 550,258 538,257
               C462,255 388,248 354,244 C342,238 340,214 350,208 Z"
            fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
      <g fill="none" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round" opacity=".9">
        <path d="M372,220 C412,230 466,244 520,254"/>
        <path d="M368,232 C406,240 458,250 512,256"/>
        <path d="M366,240 C400,246 448,252 498,256"/>
      </g>
      <ellipse cx="544" cy="250" rx="11" ry="8.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    </g>

    <!-- 近侧腿（踩踏板，正向运动学） -->
    <g transform="translate(348,282)">
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
          calcMode="linear"
          keyTimes="0;0.083333;0.166667;0.250000;0.333333;0.416667;0.500000;0.583333;0.666667;0.750000;0.833333;0.916667;1"
          values="22.74 0 0;38.43 0 0;51.25 0 0;53.61 0 0;49.04 0 0;41.68 0 0;31.86 0 0;19.47 0 0;6.47 0 0;-1.51 0 0;-0.32 0 0;8.82 0 0;22.74 0 0"/>

          <g>

              keyTimes="0;0.083333;0.166667;0.250000;0.333333;0.416667;0.500000;0.583333;0.666667;0.750000;0.833333;0.916667;1"
              values="56.53 0 0;36.64 0 0;23.89 0 0;30.98 0 0;49.71 0 0;70.20 0 0;89.07 0 0;103.58 0 0;110.29 0 0;106.84 0 0;94.53 0 0;76.77 0 0;56.53 0 0"/>
            <path d="M0,0 Q30,2 68,0" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
            <g transform="translate(68,0)">
              <g>
