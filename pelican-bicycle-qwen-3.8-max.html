<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🚴</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87ceeb 0%, #c9e8f7 60%, #e8f5e9 100%);
    font-family: sans-serif;
  }
  svg {
    width: min(90vw, 800px);
    height: auto;
    overflow: visible;
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 太阳 -->
  <circle cx="700" cy="80" r="60" fill="url(#sunGlow)"/>
  <circle cx="700" cy="80" r="32" fill="#ffd54f"/>

  <!-- 云朵1 -->
  <g fill="#ffffff" opacity="0.9">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -900 0; 0 0" dur="40s" repeatCount="indefinite"/>
    <ellipse cx="200" cy="80" rx="45" ry="18"/>
    <ellipse cx="240" cy="70" rx="35" ry="20"/>
    <ellipse cx="165" cy="72" rx="28" ry="14"/>
  </g>
  <!-- 云朵2 -->
  <g fill="#ffffff" opacity="0.8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -900 0; 0 0" dur="55s" repeatCount="indefinite"/>
    <ellipse cx="500" cy="130" rx="38" ry="15"/>
    <ellipse cx="535" cy="122" rx="28" ry="16"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="420" width="800" height="80" fill="#7cb342"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#558b2f" stroke-width="4"/>

  <!-- 移动的草地细节（表现前进感） -->
  <g stroke="#558b2f" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
      values="800 0; -100 0" dur="2s" repeatCount="indefinite"/>
    <line x1="50"  y1="445" x2="70"  y2="445"/>
    <line x1="180" y1="465" x2="205" y2="465"/>
    <line x1="320" y1="440" x2="338" y2="440"/>
    <line x1="470" y1="470" x2="495" y2="470"/>
    <line x1="600" y1="450" x2="618" y2="450"/>
    <line x1="720" y1="468" x2="742" y2="468"/>
  </g>

  <!-- ============ 自行车 + 鹈鹕（整体轻微上下颠簸） ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- ===== 自行车 ===== -->
    <g stroke="#e53935" stroke-width="7" fill="none" stroke-linecap="round">
      <!-- 后轮 -->
      <g>
        <circle cx="270" cy="380" r="55" stroke="#37474f" stroke-width="8"/>
        <g stroke="#90a4ae" stroke-width="3">
          <line x1="270" y1="325" x2="270" y2="435"/>
          <line x1="215" y1="380" x2="325" y2="380"/>
          <line x1="231" y1="341" x2="309" y2="419"/>
          <line x1="309" y1="341" x2="231" y2="419"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 270 380" to="360 270 380" dur="1s" repeatCount="indefinite"/>
        </g>
        <circle cx="270" cy="380" r="8" fill="#37474f" stroke="none"/>
      </g>
      <!-- 前轮 -->
      <g>
        <circle cx="520" cy="380" r="55" stroke="#37474f" stroke-width="8"/>
        <g stroke="#90a4ae" stroke-width="3">
          <line x1="520" y1="325" x2="520" y2="435"/>
          <line x1="465" y1="380" x2="575" y2="380"/>
          <line x1="481" y1="341" x2="559" y2="419"/>
          <line x1="559" y1="341" x2="481" y2="419"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 520 380" to="360 520 380" dur="1s" repeatCount="indefinite"/>
        </g>
        <circle cx="520" cy="380" r="8" fill="#37474f" stroke="none"/>
      </g>
      <!-- 车架 -->
      <line x1="270" y1="380" x2="390" y2="380"/> <!-- 链条下 -->
      <line x1="270" y1="380" x2="360" y2="270"/> <!-- 后上叉 -->
      <line x1="390" y1="380" x2="360" y2="270"/> <!-- 座管 -->
      <line x1="360" y1="270" x2="480" y2="280"/> <!-- 上管 -->
      <line x1="390" y1="380" x2="480" y2="280"/> <!-- 下管 -->
      <line x1="480" y1="280" x2="520" y2="380"/> <!-- 前叉 -->
      <line x1="480" y1="280" x2="465" y2="240"/> <!-- 车把立管 -->
      <line x1="440" y1="238" x2="495" y2="242"/> <!-- 车把手 -->
      <!-- 座垫 -->
      <line x1="340" y1="262" x2="385" y2="262" stroke="#212121" stroke-width="12"/>
    </g>

    <!-- 曲柄 + 脚踏 -->
    <g>
      <g stroke="#37474f" stroke-width="6" stroke-linecap="round">
        <line id="crank" x1="390" y1="380" x2="390" y2="340"/>
        <line x1="390" y1="380" x2="390" y2="420"/>
        <line x1="375" y1="340" x2="405" y2="340" stroke-width="8"/>
        <line x1="375" y1="420" x2="405" y2="420" stroke-width="8"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 390 380" to="360 390 380" dur="1s" repeatCount="indefinite"/>
      </g>
      <circle cx="390" cy="380" r="10" fill="#37474f"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 身体 -->
    <ellipse cx="355" cy="225" rx="70" ry="45" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="3"/>
    <!-- 尾巴 -->
    <path d="M 290 230 L 250 245 L 262 215 L 245 210 L 268 195 Z"
          fill="#eeeeee" stroke="#bdbdbd" stroke-width="3" stroke-linejoin="round"/>
    <!-- 脖子（S形） -->
    <path d="M 400 210 Q 445 200 450 150 Q 452 115 490 105"
          fill="none" stroke="#f5f5f5" stroke-width="26" stroke-linecap="round"/>
    <path d="M 400 210 Q 445 200 450 150 Q 452 115 490 105"
          fill="none" stroke="#bdbdbd" stroke-width="28" stroke-linecap="round"
          opacity="0.35"/>
    <!-- 头 -->
    <circle cx="495" cy="100" r="24" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="3"/>
    <!-- 大嘴（鹈鹕特征：喉囊） -->
    <path d="M 510 92 L 600 82 Q 610 84 606 94 Q 590 130 540 122 Q 515 118 508 108 Z"
          fill="#ff9800" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="500" cy="90" r="4.5" fill="#212121"/>
    <circle cx="501.5" cy="88.5" r="1.5" fill="#ffffff"/>
    <!-- 翅膀 -->
    <path d="M 320 205 Q 355 175 405 195 Q 420 225 385 240 Q 340 248 320 205 Z"
          fill="#e0e0e0" stroke="#bdbdbd" stroke-width="3"/>
    <!-- 翅膀扇动（伸向车把的"手"） -->
    <path fill="none" stroke="#eeeeee" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M 395 205 Q 430 215 462 235;
                M 395 205 Q 428 210 460 232;
                M 395 205 Q 430 215 462 235"/>
    </path>

    <!-- 腿（蹬踏动画，与曲柄同步） -->
    <!-- 左腿 -->
    <path fill="none" stroke="#ffb74d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M 350 265 Q 370 310 390 340;
                M 350 265 Q 360 330 390 420;
                M 350 265 Q 370 310 390 340"
        keyTimes="0;0.5;1"/>
    </path>
    <!-- 右腿 -->
    <path fill="none" stroke="#ffa726" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite"
        values="M 360 265 Q 372 340 390 420;
                M 360 265 Q 372 310 390 340;
                M 360 265 Q 372 340 390 420"
        keyTimes="0;0.5;1"/>
    </path>
  </g>

  <!-- 速度线 -->
  <g stroke="#90caf9" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="130" y1="300" x2="190" y2="300">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="340" x2="175" y2="340">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="260" x2="200" y2="260">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 标题 -->
  <text x="400" y="480" text-anchor="middle" font-size="20" fill="#33691e" font-weight="bold">
    🚴 鹈鹕骑行中…
  </text>
</svg>

</body>
</html>
