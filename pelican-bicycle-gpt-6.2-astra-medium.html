</svg><footer><span>FIG. 01 &nbsp;／&nbsp; 海岸骑行 · 循环动画</span><button type="button" id="toggle">Ⅱ　暂停动画</button></footer></main>
<script>
const svgNS='http://www.w3.org/2000/svg';
const spokes=document.querySelector('.spokes');
for(let i=0;i<12;i++){
 const line=document.createElementNS(svgNS,'path');
 line.setAttribute('d','M0 0L58 0');line.setAttribute('transform','rotate('+i*30+')');spokes.append(line);
}
const byId=id=>document.getElementById(id);
const setPath=(el,d)=>el.setAttribute('d',d);
function draw(t){
 const a=t*3.25, x=496+26*Math.cos(a), y=426+26*Math.sin(a), bob=2.1*Math.sin(2*a);
 byId('bird').setAttribute('transform','translate(0 '+bob+')');
 byId('scarf').setAttribute('transform','rotate('+2.5*Math.sin(a*2)+' 505 191)');
 spokes.setAttribute('transform','rotate('+t*112+')');
 byId('sea').setAttribute('patternTransform','translate('+(-t*5%145)+' 0)');
 byId('road').setAttribute('patternTransform','translate('+(-t*127%163)+' 0)');
 function leg(px,py,far){
  const group=byId(far?'farleg':'nearleg').children,hipX=far?470:458,hipY=287+bob;
  const ankleX=px-15,ankleY=py-4;
  const dx=ankleX-hipX,dy=ankleY-hipY,dist=Math.hypot(dx,dy);
  const bend=Math.sqrt(Math.max(0,86*86-dist*dist/4));
  const kneeX=(hipX+ankleX)/2+bend*dy/dist,kneeY=(hipY+ankleY)/2-bend*dx/dist;
  const limb='M'+hipX+' '+hipY+'L'+kneeX+' '+kneeY+' '+ankleX+' '+ankleY;
  setPath(group[0],limb);
  if(far){setPath(group[1],'M'+ankleX+' '+ankleY+'l22 4');return}
  setPath(group[1],limb);
  setPath(group[2],'M'+(ankleX-2)+' '+(ankleY-2)+'q7 3 13 0l12 2-5 2 7 3q-11 3-25 0Z');
 }
 leg(992-x,852-y,true);leg(x,y,false);
 const cr=byId('crank').children;
 setPath(cr[0],'M496 426L'+x+' '+y);setPath(cr[1],'M'+(x-10)+' '+(y+2)+'h23');
}
const button=byId('toggle');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0,frame;
function tick(now){if(last)time+=(now-last)/1000;last=now;draw(time);frame=requestAnimationFrame(tick)}
function sync(){cancelAnimationFrame(frame);last=0;button.textContent=playing?'Ⅱ　暂停动画':'▷　继续播放';if(playing)frame=requestAnimationFrame(tick)}
button.onclick=()=>{playing=!playing;sync()};draw(0);sync();
</script></html>
