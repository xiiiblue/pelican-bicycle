<!DOCTYPE html>

<head>

<style>

</style>

<footer><span>一段不赶时间的海岸骑行 · SVG动画</span><button id="toggle" type="button" aria-pressed="false">暂停动画</button></footer>
</main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('toggle');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function update(){scene.classList.toggle('paused',paused);button.textContent=paused?'播放动画':'暂停动画';button.setAttribute('aria-pressed',String(paused));if(!paused&&matchMedia('(prefers-reduced-motion: reduce)').matches){scene.querySelectorAll('*').forEach(el=>el.style.animationPlayState='running')}}
button.addEventListener('click',()=>{paused=!paused;update()});update();
</script>
</body>
