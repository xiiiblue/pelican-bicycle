<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在同一道“鹈鹕骑自行车”题目下，浏览和对比不同模型生成的HTML动画。">
  <meta name="theme-color" content="#f7f7f2">
  <title>鹈鹕骑自行车 · 鹈鹕实验室</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <script defer src="./assets/works.js"></script>
  <script defer src="./assets/site.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-bike" viewBox="0 0 24 24">
      <circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/>
      <path d="m5.5 16.5 4-8 4 8h-8m4-8h6.5m2.5 8L15 6h3m-10 2.5h3"/>
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path d="M13 5h6v6m0-6-8 8m6 0v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5"/>
    </symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.75" cy="10.75" r="5.75"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M9 6.5v11l8-5.5z" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="./" aria-label="鹈鹕实验室首页">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-bike"/></svg></span>
        <span class="brand-name">鹈鹕实验室 <span>PELICAN LAB</span></span>
      </a>
      <nav class="site-nav" aria-label="站内导航">
        <a href="#viewer">演示</a>
        <a href="#catalogue">目录</a>
        <a class="repository" href="https://github.com/xiiiblue/pelican-bicycle" target="_blank" rel="noopener noreferrer">
          GitHub <svg class="icon" aria-hidden="true"><use href="#icon-external"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="hero-label"><span></span> 模型生成对比</p>
        <h1 id="page-title">鹈鹕骑自行车<span class="title-period" aria-hidden="true">.</span></h1>
        <p class="hero-description">同一道题，不同模型。看看它们如何用HTML让一只鹈鹕骑上自行车。</p>
      </div>
      <dl class="hero-stats" id="hero-stats" hidden>
        <div><dt>模型作品</dt><dd id="work-total"></dd></div>
        <div><dt>模型系列</dt><dd id="family-total"></dd></div>
      </dl>
    </section>

    <noscript><p class="notice">此目录需要JavaScript。你也可以在<a href="https://github.com/xiiiblue/pelican-bicycle">GitHub仓库</a>查看各作品的HTML文件。</p></noscript>

    <div class="workbench" id="workbench" hidden>
      <section class="panel viewer" id="viewer" aria-labelledby="current-name">
        <div class="viewer-head">
          <div class="viewer-title">
            <span class="viewer-label"><span class="status-dot"></span>当前演示</span>
            <h2 id="current-name" aria-live="polite" tabindex="-1"></h2>
          </div>
          <div class="viewer-actions">
            <div class="step-buttons">
              <button class="icon-button" id="previous" type="button" aria-label="上一个作品" aria-keyshortcuts="ArrowLeft">
                <svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg>
              </button>
              <button class="icon-button" id="next" type="button" aria-label="下一个作品" aria-keyshortcuts="ArrowRight">
                <svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg>
              </button>
            </div>
            <a class="open-link" id="open-link" target="_blank" rel="noopener" aria-label="在新标签页独立打开当前作品">
              <span>独立打开</span><svg class="icon" aria-hidden="true"><use href="#icon-external"/></svg>
            </a>
          </div>
        </div>
        <div class="stage">
          <iframe id="preview" title="模型生成作品预览" sandbox="allow-scripts"></iframe>
        </div>
        <div class="viewer-footer">
          <p id="viewer-position" class="viewer-position"></p>
          <p class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd><span>切换作品</span></p>
        </div>
      </section>

      <section class="panel catalogue" id="catalogue" aria-labelledby="catalogue-title">
        <div class="catalogue-head">
          <div class="catalogue-title">
            <h2 id="catalogue-title">作品目录</h2>
            <p id="result-count" role="status"></p>
          </div>
          <div class="filters">
            <label class="search">
              <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
              <input id="model-search" type="search" aria-label="搜索模型" placeholder="搜索模型" autocomplete="off" spellcheck="false">
            </label>
            <label class="family">
              <select id="family-filter" aria-label="按模型系列筛选">
                <option value="">全部系列</option>
              </select>
              <svg class="icon" aria-hidden="true"><use href="#icon-down"/></svg>
            </label>
          </div>
        </div>
        <div class="catalogue-body" id="catalogue-body">
          <ul id="models" class="models"></ul>
          <div class="empty-state" id="empty-state" hidden>
            <p>没有找到符合条件的作品</p>
            <button type="button" id="reset-filters">清除筛选</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <template id="model-template">
    <li>
      <button type="button" class="model">
        <span class="model-thumb">
          <svg class="icon" aria-hidden="true"><use href="#icon-bike"/></svg>
        </span>
        <span class="model-info">
          <span class="model-name"></span>
          <span class="model-family"></span>
        </span>
        <span class="model-action" aria-hidden="true">
          <svg class="icon model-chevron"><use href="#icon-chevron"/></svg>
          <svg class="icon model-play"><use href="#icon-play"/></svg>
        </span>
      </button>
    </li>
  </template>

  <footer class="shell site-footer">
    <p>演示内容由对应模型生成。</p>
    <div class="footer-meta">
      <span id="busuanzi_container_site_uv">访客 <strong id="busuanzi_value_site_uv">—</strong></span>
      <span id="busuanzi_container_site_pv">浏览 <strong id="busuanzi_value_site_pv">—</strong></span>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">鲁ICP备18050487号-1</a>
    </div>
  </footer>
  <script async referrerpolicy="no-referrer-when-downgrade" src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script async type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"c1eb9e467bf94854a861cd5b98f19230"}'></script>
</body>
</html>
