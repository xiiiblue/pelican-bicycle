<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dfeef5;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  svg {
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
    border-radius: 16px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#eafaff"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8b26a"/>
      <stop offset="1" stop-color="#f2921f"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="560" fill="url(#skyGrad)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g>
    <g stroke="#ffd75e" stroke-width="6" stroke-linecap="round">
      <line x1="195" y1="110" x2="213" y2="110"/>
      <line x1="178.9" y1="148.9" x2="191.6" y2="161.6"/>
      <line x1="140" y1="165" x2="140" y2="183"/>
      <line x1="101.1" y1="148.9" x2="88.4" y2="161.6"/>
      <line x1="85" y1="110" x2="67" y2="110"/>
      <line x1="101.1" y1="71.1" x2="88.4" y2="58.4"/>
      <line x1="140" y1="55" x2="140" y2="37"/>
      <line x1="178.9" y1="71.1" x2="191.6" y2="58.4"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 140 110" to="360 140 110" dur="50s" repeatCount="indefinite"/>
    </g>
    <circle cx="140" cy="110" r="45" fill="#ffd75e" stroke="#ffca3a" stroke-width="4"/>
  </g>

  <!-- 云朵（从右向左飘过） -->
  <g fill="#ffffff" opacity="0.92">
    <g transform="translate(0,90)">
      <rect x="-28" y="4" width="56" height="16" rx="8"/>
      <circle cx="0" cy="0" r="22"/>
      <circle cx="26" cy="4" r="18"/>
      <circle cx="-26" cy="6" r="16"/>
      <animateTransform attributeName="transform" type="translate"
        from="950 90" to="-450 90" dur="46s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(0,160)">
      <rect x="-22" y="3" width="44" height="12" rx="6"/>
      <circle cx="0" cy="0" r="14"/>
      <circle cx="17" cy="3" r="12"/>
      <circle cx="-17" cy="4" r="11"/>
      <animateTransform attributeName="transform" type="translate"
        from="950 160" to="-450 160" dur="33s" begin="-20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远处的山丘 -->
  <path d="M-50 500 Q 150 420 350 500 Z" fill="#a8d5a2"/>
  <path d="M280 500 Q 580 430 950 500 Z" fill="#8fc489"/>

  <!-- 道路 -->
  <rect y="500" width="900" height="60" fill="#84818c"/>
  <line x1="0" y1="534" x2="900" y2="534" stroke="#ffffff" stroke-width="5"
        stroke-dasharray="40 30" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- ========== 自行车 ========== -->
  <g>
    <!-- 后轮 -->
    <circle cx="230" cy="415" r="85" fill="#fdfdfd" stroke="#2f2f31" stroke-width="10"/>
    <g stroke="#b9bec4" stroke-width="4">
      <line x1="145" y1="415" x2="315" y2="415"/>
      <line x1="272.5" y1="341.4" x2="187.5" y2="488.6"/>
      <line x1="187.5" y1="341.4" x2="272.5" y2="488.6"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 230 415" to="360 230 415" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle cx="230" cy="415" r="9" fill="#555"/>

    <!-- 前轮 -->
    <circle cx="610" cy="415" r="85" fill="#fdfdfd" stroke="#2f2f31" stroke-width="10"/>
    <g stroke="#b9bec4" stroke-width="4">
      <line x1="525" y1="415" x2="695" y2="415"/>
      <line x1="652.5" y1="341.4" x2="567.5" y2="488.6"/>
      <line x1="567.5" y1="341.4" x2="652.5" y2="488.6"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 610 415" to="360 610 415" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle cx="610" cy="415" r="9" fill="#555"/>

    <!-- 车架 -->
    <g stroke="#2a9d8f" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M230 415 L390 420"/>          <!-- 后下叉 -->
      <path d="M230 415 L330 285"/>          <!-- 后上叉 -->
      <path d="M390 420 L330 285"/>          <!-- 立管 -->
      <path d="M330 285 L565 278"/>          <!-- 上管 -->
      <path d="M390 420 L575 292"/>          <!-- 下管 -->
      <path d="M575 292 L610 415"/>          <!-- 前叉 -->
    </g>
    <!-- 车把 -->
    <g stroke="#2a9d8f" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M570 280 L585 250"/>
      <path d="M572 246 L602 242"/>
    </g>
    <circle cx="602" cy="242" r="6" fill="#333"/>

    <!-- 链条 -->
    <g stroke="#6b6b6b" stroke-width="3" opacity="0.8">
      <line x1="390" y1="396" x2="230" y2="407"/>
      <line x1="390" y1="444" x2="230" y2="423"/>
    </g>

    <!-- 牙盘、曲柄、脚踏（旋转，dur=2.4s 与腿同步） -->
    <g>
      <circle cx="390" cy="420" r="22" fill="none" stroke="#1f7a6d" stroke-width="6"/>
      <line x1="390" y1="420" x2="435" y2="420" stroke="#444" stroke-width="9" stroke-linecap="round"/>
      <line x1="390" y1="420" x2="345" y2="420" stroke="#444" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="345" cy="420" rx="9" ry="6" fill="#d08d46"/>
      <ellipse cx="435" cy="420" rx="11" ry="7" fill="#f4a261" stroke="#d08d46" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 390 420" to="360 390 420" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远侧的腿（身体后面） -->
  <line x1="362" y1="310" x2="345" y2="420" stroke="#d08d46" stroke-width="9" stroke-linecap="round">
    <animate attributeName="x2" dur="2.4s" repeatCount="indefinite"
      values="345;358.2;390;421.8;435;421.8;390;358.2;345"/>
    <animate attributeName="y2" dur="2.4s" repeatCount="indefinite"
      values="420;388.2;375;388.2;420;451.8;465;451.8;420"/>
  </line>

  <!-- ========== 鹈鹕（整体轻微上下颠簸） ========== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -3; 0 0" dur="2.4s" repeatCount="indefinite"/>

    <!-- 车座 -->
    <rect x="302" y="274" width="56" height="12" rx="6" fill="#3b3b3d"/>

    <!-- 尾羽 -->
    <path d="M295 210 L235 175 L265 225 Z" fill="#d7dee4" stroke="#b8c4cc" stroke-width="2"/>
    <path d="M300 235 L245 235 L275 262 Z" fill="#d7dee4" stroke="#b8c4cc" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="390" cy="238" rx="116" ry="78" fill="#ffffff" stroke="#dde6ea" stroke-width="2"
             transform="rotate(-8 390 238)"/>

    <!-- 翅膀（轻微扇动） -->
    <g>
      <ellipse cx="375" cy="246" rx="80" ry="45" fill="#e6edf1" stroke="#c4cfd6" stroke-width="2"
               transform="rotate(-12 375 246)"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-14 340 225; -6 340 225; -14 340 225" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- 脖子 -->
    <ellipse cx="468" cy="200" rx="30" ry="40" fill="#ffffff" stroke="#dde6ea" stroke-width="2"/>

    <!-- 头 -->
    <circle cx="492" cy="178" r="37" fill="#ffffff" stroke="#dde6ea" stroke-width="2"/>

    <!-- 大喉囊（鹈鹕标志！） -->
    <path d="M512 196 C 545 262 610 276 644 208 C 610 242 545 242 512 202 Z"
          fill="#f8c795" stroke="#e08d4e" stroke-width="2"/>

    <!-- 上喙 -->
    <path d="M500 166 L654 203 Q658 208 652 212 L518 196 Q504 180 500 166 Z"
          fill="url(#beakGrad)" stroke="#e08d4e" stroke-width="2"/>

    <!-- 眼睛（会眨眼） -->
    <ellipse cx="503" cy="175" rx="6" ry="6" fill="#222222">
      <animate attributeName="ry" values="6;6;0.4;6" keyTimes="0;0.92;0.96;1"
               dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 飘动的红围巾 -->
    <g fill="#e63946">
      <polygon points="468,214 385,182 390,204">
        <animateTransform attributeName="transform" type="rotate"
          values="-7 468 214; 10 468 214; -7 468 214" dur="1.2s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="468" cy="214" r="11" fill="#c1123f"/>
    </g>
  </g>

  <!-- 近侧的腿（身体前面） -->
  <line x1="383" y1="318" x2="435" y2="420" stroke="#f4a261" stroke-width="9" stroke-linecap="round">
    <animate attributeName="x2" dur="2.4s" repeatCount="indefinite"
      values="435;421.8;390;358.2;345;358.2;390;421.8;435"/>
    <animate attributeName="y2" dur="2.4s" repeatCount="indefinite"
      values="420;451.8;465;451.8;420;388.2;375;388.2;420"/>
  </line>

  <!-- 标题 -->
  <text x="24" y="540" font-size="20" fill="#f2f2f2" opacity="0.9">鹈鹕骑行日 🐦🚲</text>
</svg>
</body>
</html>
