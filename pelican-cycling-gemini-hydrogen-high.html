<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Hydrogen High · 鹈鹕骑自行车</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-sans, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif);
    color: var(--foreground, #1f2937);
  }

  .wrap {
    width: 100%;
    max-width: 728px;
    margin: 0 auto;
  }

  .stage {
    width: 100%;
    border-radius: var(--radius, 14px);
    overflow: hidden;
    border: 1px solid var(--border, rgba(15, 23, 42, 0.12));
  }

  svg#scene {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: var(--radius, 12px);
    background: var(--card, rgba(248, 250, 252, 0.9));
    color: var(--card-foreground, #1e293b);
    border: 1px solid var(--border, rgba(15, 23, 42, 0.12));
    font-size: 13px;
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  button {
    appearance: none;
    border: 1px solid var(--border, rgba(15, 23, 42, 0.16));
    background: var(--secondary, #e2e8f0);
    color: var(--secondary-foreground, #0f172a);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  button:hover {
    opacity: 0.9;
  }

  button:active {
    transform: translateY(1px);
  }

  button.active {
    background: var(--primary, #0d9488);
    color: var(--primary-foreground, #ffffff);
    border-color: transparent;
  }

  .hint {
    font-size: 12px;
    opacity: 0.72;
  }

  #eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.4s infinite;
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }

  .ring-wave {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }

  .ring-wave.ringing {
    animation: bellRing 0.65s ease-out forwards;
  }

  @keyframes bellRing {
    0%   { opacity: 0.95; transform: scale(0.6); }
    100% { opacity: 0;    transform: scale(2.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    #eye { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">

      <!-- 1. 天空与太阳 -->

        <!-- 车把与车铃 -->
        <line x1="484" y1="260" x2="490" y2="232" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 490 232 Q 478 225 462 230" fill="none" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="472" y1="227" x2="458" y2="231" stroke="#1e293b" stroke-width="9.5" stroke-linecap="round"/>

        <!-- 车铃及响铃波纹 -->
        <g id="bellGroup" style="cursor:pointer;">
          <circle cx="481" cy="224" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
          <circle class="ring-wave" id="ringWave1" cx="481" cy="224" r="10" fill="none" stroke="#f59e0b" stroke-width="2.2"/>

          <g transform="translate(524, 240) rotate(-25)">

        <!-- 尾羽 -->

  </div>

  <div class="controls">
    <div class="btn-group">
      <button type="button" data-speed="0.55">慢速兜风</button>
      <button type="button" data-speed="1" class="active">正常骑行</button>
      <button type="button" data-speed="1.75">冲刺加速</button>
      <button type="button" id="toggleBtn">暂停</button>
      <button type="button" id="bellBtn">按车铃</button>
    </div>
    <span class="hint">可点击速度档位或车铃互动</span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const C = { x: 392, y: 364 };
  const CRANK_R = 22;
  const WHEEL_R = 58;
  const L1 = 52;
  const L2 = 52;

  const BASE_PEDAL_RAD = Math.PI * 2 * 0.72;
  const BASE_WHEEL_RAD = 3.9;
  const BASE_GROUND_PX = BASE_WHEEL_RAD * WHEEL_R;

  const spokesR = $('spokesR');
  const spokesF = $('spokesF');
  const chainring = $('chainring');
  const roadDashes = $('roadDashes');
  const fgLayer = $('fgLayer');
  const hillsLayer = $('hillsLayer');
  const cloudsLayer = $('cloudsLayer');
  const gullsLayer = $('gullsLayer');
  const seaWaves = $('seaWaves');
  const sailboat = $('sailboat');
  const pelicanBob = $('pelicanBob');
  const scarfTail = $('scarfTail');
  const wingArm = $('wingArm');
  const pouch = $('pouch');
  const bellGroup = $('bellGroup');
  const ringWave1 = $('ringWave1');
  const ringWave2 = $('ringWave2');
  const toggleBtn = $('toggleBtn');
  const bellBtn = $('bellBtn');

  const legs = [
    {
      crank: $('crankFar'),
      pedal: $('pedalFar'),
      leg: $('legFar'),
      foot: $('footFar'),
      hip: { x: 356, y: 290 },
      phase: Math.PI
    },
    {
      crank: $('crankNear'),
      pedal: $('pedalNear'),
      leg: $('legNear'),
      foot: $('footNear'),
      hip: { x: 368, y: 286 },
      phase: 0
    }
  ];

  // 双连杆逆向运动学：由髋部 H 与脚踝 F 求解向前弯曲的膝盖坐标 K
  function solveKnee(H, F) {
    let dx = F.x - H.x;
    let dy = F.y - H.y;
    let d = Math.hypot(dx, dy);
    const maxD = L1 + L2 - 1;
    if (d > maxD) {
      dx *= maxD / d;
      dy *= maxD / d;
      d = maxD;
    }
    if (d < 1e-3) d = 1e-3;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const ux = dx / d;
    const uy = dy / d;
    const px = -uy;
    const py = ux;
    const dir = px > 0 ? 1 : -1;
    return {
      x: H.x + ux * a + px * h * dir,
      y: H.y + uy * a + py * h * dir
    };
  }

  function triggerBell() {
    for (const el of [ringWave1, ringWave2]) {
      el.classList.remove('ringing');
      void el.offsetWidth;
      el.classList.add('ringing');
    }
  }

  bellBtn.addEventListener('click', triggerBell);
  bellGroup.addEventListener('click', triggerBell);

  let speedMult = 1;
  let paused = false;
  let simTime = 0;

  document.querySelectorAll('button[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      speedMult = parseFloat(btn.dataset.speed);
      document.querySelectorAll('button[data-speed]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  toggleBtn.addEventListener('click', () => {
    paused = !paused;
    toggleBtn.textContent = paused ? '继续' : '暂停';
  });

  function renderFrame(t) {
    const th = t * BASE_PEDAL_RAD;
    const wheelDeg = (t * BASE_WHEEL_RAD * 180) / Math.PI;
    const groundDist = t * BASE_GROUND_PX;

    // 车轮与牙盘旋转
    spokesR.setAttribute('transform', `rotate(${wheelDeg} 285 362)`);
    spokesF.setAttribute('transform', `rotate(${wheelDeg} 515 362)`);
    chainring.setAttribute('transform', `rotate(${(th * 180) / Math.PI} 392 364)`);

    // 地面与多层视差背景无缝循环滚动
    roadDashes.setAttribute('transform', `translate(${-(groundDist % 160)} 0)`);
    fgLayer.setAttribute('transform', `translate(${-((groundDist * 1.18) % 320)} 0)`);
    hillsLayer.setAttribute('transform', `translate(${-((groundDist * 0.22) % 520)} 0)`);
    seaWaves.setAttribute('transform', `translate(${-((groundDist * 0.08) % 420)} 0)`);
    cloudsLayer.setAttribute('transform', `translate(${-((t * 10) % 960)} 0)`);
    gullsLayer.setAttribute('transform', `translate(${-((t * 18) % 960)} ${Math.sin(t * 2.4) * 4})`);
    sailboat.setAttribute('transform', `translate(${840 - ((t * 8 + 200) % 900)} ${304 + Math.sin(t * 1.8) * 1.5})`);

    // 鹈鹕身体轻柔颠簸与摇摆
    const bobY = Math.sin(th * 2) * 2.5;
    const tilt = Math.sin(th * 2 + 0.6) * 1.4;
    pelicanBob.setAttribute('transform', `translate(0 ${bobY}) rotate(${tilt} 358 240)`);

    // 扶把翅膀末端锁定在车把 (462, 230)
    wingArm.setAttribute('d', `M 412 ${216 + bobY} C 432 ${232 + bobY * 0.5} 446 236 462 230`);

    // 围巾随风摆动，喉囊围绕上喙边缘轻微弹性晃动
    scarfTail.setAttribute('transform', `rotate(${Math.sin(t * 10) * 11 - 4} 426 184)`);
    const pouchScale = 1 + Math.sin(th * 2) * 0.03;
    pouch.setAttribute('transform', `translate(527 158) scale(1 ${pouchScale}) translate(-527 -158)`);

    // 双腿逆向运动学
    for (const p of legs) {
      const ang = th + p.phase;
      const px = C.x + CRANK_R * Math.cos(ang);
      const py = C.y + CRANK_R * Math.sin(ang);

      p.crank.setAttribute('x2', px);
      p.crank.setAttribute('y2', py);
      p.pedal.setAttribute('transform', `translate(${px} ${py})`);

      const H = { x: p.hip.x, y: p.hip.y + bobY };
      const F = { x: px, y: py - 8 };
      const K = solveKnee(H, F);

      p.leg.setAttribute('d', `M ${H.x} ${H.y} L ${K.x} ${K.y} L ${F.x} ${F.y}`);
      p.foot.setAttribute('transform', `translate(${px} ${py - 8}) rotate(${Math.cos(ang) * 7})`);
    }
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    renderFrame(0.35);
    return;
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) {
      simTime += dt * speedMult;
      renderFrame(simTime);
    }
    requestAnimationFrame(loop);
  }
  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
